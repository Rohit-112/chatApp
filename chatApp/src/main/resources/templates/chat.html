<script>
    let stompClient = null;
    let connectedUser = "";

    function connect(username) {
        // ⛔ You must replace this with a real token
        // Either get it from login or hardcode a generated one
        const token = "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ" + username + "\"}"; // Replace with actual JWT

        const socket = new SockJS('/ws-chat?token=' + token);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, () => {
            stompClient.subscribe('/user/queue/messages', (msg) => {
                const message = JSON.parse(msg.body);
                showMessage(message.sender + ": " + message.content);
            });
            showMessage("✅ Connected as " + username);
        }, (error) => {
            showMessage("❌ Connection failed: " + error);
        });
    }

    function sendMessage() {
        const sender = document.getElementById("username").value.trim();
        const receiver = document.getElementById("receiver").value.trim();
        const content = document.getElementById("messageInput").value.trim();

        if (!sender || !receiver || !content) {
            alert("Please fill all fields.");
            return;
        }

        const message = {
            sender: sender,
            receiver: receiver,
            content: content,
            type: 'CHAT'
        };

        stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(message));
        showMessage("You: " + content);
        document.getElementById("messageInput").value = "";
    }

    function showMessage(message) {
        const messagesDiv = document.getElementById("messages");
        const p = document.createElement("p");
        p.textContent = message;
        messagesDiv.appendChild(p);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    document.getElementById("username").addEventListener("change", function () {
        const newUser = this.value.trim();
        if (newUser && newUser !== connectedUser) {
            connectedUser = newUser;
            connect(connectedUser);
        }
    });
</script>
