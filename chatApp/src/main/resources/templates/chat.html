<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>Simple Chat Test (Open in 2 Tabs)</h2>

<select id="userSelect">
    <option value="">Select User</option>
    <option value="1">User 1</option>
    <option value="2">User 2</option>
</select>

<br/><br/>

Receiver ID: <input type="text" id="receiver" placeholder="e.g., 1 or 2"><br/><br/>
Message: <input type="text" id="messageInput"><br/><br/>

<button onclick="sendMessage()">Send</button>

<div id="messages" style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; margin-top: 20px;"></div>

<script>
    let stompClient = null;
    let connectedUserId = "";
    let tokenMap = {
        "4": "",
        "2": ""
    };

    document.getElementById("userSelect").addEventListener("change", function () {
        const selected = this.value;
        if (selected && selected !== connectedUserId) {
            connectedUserId = selected;
            connect(selected);
        }
    });

    function connect(userId) {
        const token = tokenMap[userId];
        if (!token) {
            alert("Invalid user/token setup.");
            return;
        }

        const socket = new SockJS('/ws-chat?token=' + token);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, () => {
            stompClient.subscribe('/user/queue/messages', (msg) => {
                const message = JSON.parse(msg.body);
                showMessage(`📩 From User ${message.sender}: ${message.content}`);
            });
            showMessage(`✅ Connected as User ${userId}`);
        }, (error) => {
            showMessage("❌ Connection failed: " + error);
        });
    }

    function sendMessage() {
        const receiverId = document.getElementById("receiver").value.trim();
        const content = document.getElementById("messageInput").value.trim();

        if (!connectedUserId || !receiverId || !content) {
            alert("Select sender, receiver, and write a message.");
            return;
        }

        const message = {
            sender: connectedUserId,
            receiver: receiverId,
            content: content,
            type: 'CHAT'
        };

        stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(message));
        showMessage(`🧑‍💬 You (User ${connectedUserId}): ${content}`);
        document.getElementById("messageInput").value = "";
    }

    function showMessage(msg) {
        const messagesDiv = document.getElementById("messages");
        const p = document.createElement("p");
        p.textContent = msg;
        messagesDiv.appendChild(p);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>
</body>
</html>
