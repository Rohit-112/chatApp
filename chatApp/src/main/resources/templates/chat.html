<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Simple Chat</title>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        input[type="text"] {
            margin: 5px 0;
            padding: 6px;
            width: 200px;
        }

        button {
            padding: 6px 10px;
        }
    </style>
</head>
<body>
<h3>Simple Chat</h3>

<label>Your name:</label><br>
<input type="text" id="username" placeholder="Your name"><br>

<label>Receiver name:</label><br>
<input type="text" id="receiver" placeholder="Receiver name"><br>

<div id="messages"></div>

<input type="text" id="messageInput" placeholder="Message">
<button onclick="sendMessage()">Send</button>

<script>
    let stompClient = null;
    let connectedUser = "";

    function connect(username) {
        const socket = new SockJS('/ws-chat?user=' + username);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, () => {
            stompClient.subscribe('/user/queue/messages', (msg) => {
                const message = JSON.parse(msg.body);
                showMessage(message.sender + ": " + message.content);
            });
            showMessage("✅ Connected as " + username);
        });
    }

    function sendMessage() {
        const sender = document.getElementById("username").value.trim();
        const receiver = document.getElementById("receiver").value.trim();
        const content = document.getElementById("messageInput").value.trim();

        if (!sender || !receiver || !content) {
            alert("Please fill all fields.");
            return;
        }

        const message = {
            sender: sender,
            receiver: receiver,
            content: content,
            type: 'CHAT'
        };

        stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(message));
        showMessage("You: " + content);
        document.getElementById("messageInput").value = "";
    }

    function showMessage(message) {
        const messagesDiv = document.getElementById("messages");
        const p = document.createElement("p");
        p.textContent = message;
        messagesDiv.appendChild(p);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    document.getElementById("username").addEventListener("change", function () {
        const newUser = this.value.trim();
        if (newUser && newUser !== connectedUser) {
            connectedUser = newUser;
            connect(connectedUser);
        }
    });
</script>
</body>
</html>
