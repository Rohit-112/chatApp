<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Page</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

  <script src="js/chat.js" defer></script>


  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4CAF50;
      color: white;
      padding: 15px;
      text-align: center;
      position: relative;
    }

    #logged-user {
      font-weight: bold;
    }

    #logout-button {
      position: absolute;
      right: 10px;
      top: 10px;
      padding: 6px 12px;
      background-color: red;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .content {
      padding: 20px;
    }

    #message-container {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      background: white;
      margin-bottom: 10px;
    }

    .message {
      margin: 5px 0;
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 60%;
      word-wrap: break-word;
      display: inline-block;
      clear: both;
    }

    .sent {
      background-color: #dcf8c6;
      float: right;
      text-align: right;
    }

    .received {
      background-color: #ffffff;
      float: left;
      text-align: left;
    }

    #message-input {
      width: 70%;
      padding: 8px;
    }

    #send-button {
      padding: 8px 12px;
    }
  </style>
</head>
<body>

<header>
  Chat Room - Logged in as <span id="logged-user"></span>
  <button id="logout-button">Logout</button>
</header>

<div class="content">
  <div id="message-container">
    <!-- Messages will appear here -->
  </div>

  <div>
    <label for="message-input"></label><input type="text" id="message-input" placeholder="Type your message..." />
    <button id="send-button">Send</button>
  </div>
</div>

</body>
</html>
