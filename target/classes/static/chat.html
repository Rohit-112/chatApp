<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat App</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif;">

<div class="container" style="display: flex; height: 100vh;">

  <!-- Sidebar (User list) -->
  <div class="sidebar" style="width: 25%; background-color: #f1f1f1; border-right: 1px solid #ccc; padding: 10px; overflow-y: auto;">
    <h2 style="margin-top: 0;">Users</h2>
    <ul id="userList" style="list-style-type: none; padding: 0;">
      <!-- User list will be populated here by JavaScript -->
    </ul>
  </div>

  <!-- Chat panel -->
  <div class="chat-panel" style="width: 75%; display: flex; flex-direction: column;">
    <div class="chat-header" style="padding: 10px; background-color: #f1f1f1; border-bottom: 1px solid #ccc;">
      <h3 id="selectedUserName" style="margin: 0; font-size: 18px; font-weight: bold;">Select a user to chat</h3>
    </div>
    <div id="chatMessages" class="chat-messages" style="flex: 1; padding: 10px; overflow-y: auto; background-color: #fafafa;">
      <!-- Messages will be dynamically added here -->
    </div>
    <div class="chat-input" style="display: flex; padding: 10px; border-top: 1px solid #ccc;">
      <input type="text" id="messageInput" placeholder="Type a message..." style="flex: 1; padding: 8px; font-size: 16px;" />
      <button onclick="sendMessage()" style="padding: 8px 16px; margin-left: 10px;">Send</button>
    </div>
  </div>

</div>

<!--<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>-->
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/chat.js"></script>

</body>
</html>
