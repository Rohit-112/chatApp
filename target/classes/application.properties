spring.application.name=chatApp

# port configuration
server.port=8081

#Frontend Template Config
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Debug Login
logging.level.org.springframework.beans.factory=DEBUG
